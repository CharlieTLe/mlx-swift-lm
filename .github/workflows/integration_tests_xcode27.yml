name: Integration Tests (xcode-27)

# Fork-only experiment: run the IntegrationTesting suite on GitHub's hosted
# `xcode-27` image instead of the self-hosted mac that integration_tests.yml
# uses. The nightly cannot answer the question this workflow asks, because it
# pins Xcode 26, where every `canImport(FoundationModels, _version: 2)` block
# compiles out and the MLXFoundationModels suites simply do not exist.
#
# What the hosted `xcode-27` image actually is, measured rather than read off
# actions/runner-images metadata (image xcode-27-arm64, label documented as a
# public preview):
#   - arm64, host OS macOS 27.0 (26A5406e), so a macOS 27 host, not 26
#   - macOS 27.0 SDK installed
#   - the default toolchain moves. 2026-09-17 morning it was Xcode 27.0 beta 6
#     (27A5252f) in /Applications/Xcode_27_beta_6.app; by that afternoon it was
#     the release candidate, reporting build 27A266a, in
#     /Applications/Xcode_27_Release_Candidate.app. The assert step below is what
#     keeps that drift honest.
#   - MetalToolchain is NOT preinstalled; -downloadComponent fetches it in ~17s
#   - ~36Gi free on /, one 3.3G Xcode, no simulator runtimes, so nothing
#     meaningful to reclaim (see the "Report free space" step)
#
# So the FM suites both compile here (the 27 SDK makes
# `canImport(..., _version: 2)` true) and execute at `DeviceTier.full`, because
# the host satisfies the `@available(macOS 27, *)` FM surface. See
# IntegrationTestingTests/MLXFoundationModelsIntegration/PlatformAvailability/DeviceTier.swift.
# A green run here does mean "the FoundationModels adapter works end to end".
#
# Why this is sharded. Run 35178760598 ran the whole suite in one job and hit
# ENOSPC 22 minutes in with a 28G Hugging Face cache and models still queued; 12
# of its 17 issues were ENOSPC or truncated downloads. Each matrix shard is a
# separate VM with a separate empty cache, so it downloads only what its own
# suites touch. That bounds peak disk per job and runs the shards in parallel.
#
# Repo size is NOT download size, which an earlier revision of this comment got
# wrong by quoting ~85 GB of Hugging Face repo sizes as the suite's footprint.
# The tokenizer suites fetch tokenizer and config files only, ~27M measured, not
# the 19.4G and 12.1G their repos weigh, so the real full-suite total is nearer
# 53 GB. Still far past ~36Gi, so the conclusion holds, but budget from measured
# downloads rather than repo sizes.
#
# Repo sizes, useful only as upper bounds:
#   gemma-4-31b-it-8bit 33.8  Muse-Glimmer-30B-4bit 19.4  gpt-oss-20b-Q8 12.1
#   gemma-4-e4b 5.2  gemma-4-e2b 3.6  Qwen3-VL-4B 3.1  Qwen3-4B 2.3
#   Qwen2.5-3B 1.7  Qwen3-1.7B 1.0  R1-Distill-1.5B 1.0  Llama-3.2-1B 0.7
#   gemma-3-270m 0.2  the *-assistant-bf16 MTP drafters 0.2 to 1.0 each
#
# The four suites that load gemma-4-31b-it-8bit are deliberately in NO shard:
# 33.8 GB against ~36Gi leaves no room for the build, and
# MTPIteratorEndToEndDiagnosticTests also pulls e4b and e2b. They cannot run on
# this image at any shard granularity. They keep their coverage on the
# self-hosted mac via integration_tests.yml, which has a warm cache and real
# disk. Skipped by identifier in the `core` shard below.
#
# The FM tree is split further (guided / toolcalling / fm-sessions) because disk
# is not the only limit. A single 218-test shard ran 105 minutes and then died
# with "The hosted runner lost communication with the server" (run 35293302777),
# as did the unsharded run before it. Shorter shards on fresh VMs are the
# hypothesis; the "Start resource sampler" step below exists to replace that
# hypothesis with evidence, because the log GitHub returns after such a death is
# truncated to whatever was flushed and shows nothing.
#
# Shard sizes by test count: guided 82, fm-sessions 58, core 48, toolcalling 30,
# and 2 each for tokenizers, vision and gemma4-eseries. Verified against
# `xcodebuild -enumerate-tests`: 224 of 241 tests are assigned, none twice, and
# the 17 unassigned are exactly the MTP exclusions above.
#
# Measured results so far: tokenizers, vision and gemma4-eseries green in 4 to
# 5.5 minutes each. gemma4-eseries is a no-op on a fresh VM: both its tests are
# `.enabled(if: hfSnapshotDir(...) != nil)` and so DISABLED without a warm cache,
# which is why it "passes" in 0.002 seconds.
on:
  # `workflow_dispatch` on its own is not enough while iterating: GitHub only
  # offers a dispatchable workflow if the file exists on the default branch.
  # The push trigger below lets the experiment run straight from a branch.
  workflow_dispatch:
    inputs:
      only_testing:
        description: >-
          Optional space-separated xctest identifiers (Target/Suite or
          Target/Suite/test) to narrow the run, e.g.
          "IntegrationTestingTests/PlatformCompatibilityProbes". Empty runs
          everything.
        required: false
        default: ''
  push:
    branches: ['ci/xcode-27**']

permissions:
  contents: read

# Unlike integration_tests.yml this does NOT need to serialize repo-wide: every
# run gets a fresh hosted VM with its own empty Hugging Face cache, so there is
# no shared on-disk cache for two runs to race. Keyed by ref and cancelling in
# progress, because this is an experiment where the newest push is the one worth
# spending ~2h of macOS runner time on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration_tests_xcode27:
    # Never upstream: `!=` rather than pinning one fork, so this file behaves the
    # same in anyone's fork but stays inert in ml-explore/mlx-swift-lm, which has
    # its own self-hosted nightly and should not spend hosted macOS minutes here.
    if: github.repository != 'ml-explore/mlx-swift-lm'
    runs-on: xcode-27
    # Higher than the nightly's 120: that machine has a warm Hugging Face cache
    # built up over previous runs, and every run here starts cold and re-downloads
    # every model it touches. Hosted jobs are hard-capped at 6h regardless.
    timeout-minutes: 180
    name: xcode27 (${{ matrix.shard.name }})
    strategy:
      # Every shard is an independent disk budget and an independent question.
      # One shard filling its disk says nothing about the others, so do not
      # cancel them.
      fail-fast: false
      matrix:
        shard:
          # Catch-all, and deliberately skip-based rather than only-based: a
          # newly added suite lands here automatically instead of silently
          # running in no shard at all. Holds the root-level suites.
          - name: core
            needs_gb: 16
            skip: >-
              IntegrationTestingTests/MuseGlimmerTokenizerIntegrationTests
              IntegrationTestingTests/HarmonyTokenizerIntegrationTests
              IntegrationTestingTests/Gemma4EseriesLoadIntegrationTests
              IntegrationTestingTests/VisionIntegrationTests
              IntegrationTestingTests/StaleWeightIndexIntegrationTests
              IntegrationTestingTests/MTPIteratorEndToEndDiagnosticTests
              IntegrationTestingTests/Rung4TokenParityTests
              IntegrationTestingTests/testAcceptanceRateFloor64TokenBlock4Temp0()
              IntegrationTestingTests/testMTPMidGenerationKVQuantizationCompletesWithoutCrash()
              IntegrationTestingTests/GenerableRoundTripTests
              IntegrationTestingTests/GuidedGenerationTests
              IntegrationTestingTests/GuidedGenerationIntegrationTests
              IntegrationTestingTests/MultiModelGuidedGenerationTests
              IntegrationTestingTests/HardReserveStressTests
              IntegrationTestingTests/GuidedGenerationBenchmarkTests
              IntegrationTestingTests/GuidedGenerationUsageTests
              IntegrationTestingTests/MaxTokenTruncationTests
              IntegrationTestingTests/PrewarmGrammarTests
              IntegrationTestingTests/RequiredPropertyStressTests
              IntegrationTestingTests/StopTokenRegressionIntegrationTests
              IntegrationTestingTests/TokenizerVocabExtractorTests
              IntegrationTestingTests/XGrammarBridgeTests
              IntegrationTestingTests/EmitStopSignalTests
              IntegrationTestingTests/FastForwardTokenizationDisagreementTests
              IntegrationTestingTests/ForkIndependenceTests
              IntegrationTestingTests/LoopInvariantsOnXGrammarTests
              IntegrationTestingTests/RollbackDeterminismTests
              IntegrationTestingTests/FoundationModelsToolCallingTests
              IntegrationTestingTests/ToolCallingReasoningTests
              IntegrationTestingTests/MultiTurnToolCallingTests
              IntegrationTestingTests/ToolCallingReasoningCharacterizationTests
              IntegrationTestingTests/StructuredToolOutputSessionTests
              IntegrationTestingTests/ToolCallGrammarCharacterizationTests
              IntegrationTestingTests/ToolCallRoundTripTests
              IntegrationTestingTests/IntegrationTests
              IntegrationTestingTests/SessionUsageAccountingTests
              IntegrationTestingTests/UpdateUsageEmissionTests
              IntegrationTestingTests/ApplyChatTemplateProbeTests
              IntegrationTestingTests/StreamingDeltaTests
              IntegrationTestingTests/PlainChatGenerationTests
              IntegrationTestingTests/SamplingModeBehaviorTests
              IntegrationTestingTests/ReasoningIntegrationTests
              IntegrationTestingTests/ReasoningCapabilityGateTests
              IntegrationTestingTests/ReasoningFamilyVerificationTests
              IntegrationTestingTests/ConfigurationResolverRoutingTests
              IntegrationTestingTests/PlatformCompatibilityProbes
              IntegrationTestingTests/HuggingFaceLanguageModelMacroSmoke
              IntegrationTestingTests/ColdHubClientFetchTests
              IntegrationTestingTests/GoldenReplayTests
              IntegrationTestingTests/GoldenFixtureManifestTests
              IntegrationTestingTests/MalformedSchemaErrorParityTests
              IntegrationTestingTests/ToolCallIntegrationTests
          # MLXFoundationModelsIntegration/GuidedGeneration and its Grammar
          # subdirectory. The largest group, and all on gemma-3-270m (0.2G) plus
          # Llama-3.2-1B and Qwen2.5-3B for the multi-model suite.
          - name: guided
            needs_gb: 12
            only: >-
              IntegrationTestingTests/GenerableRoundTripTests
              IntegrationTestingTests/GuidedGenerationTests
              IntegrationTestingTests/GuidedGenerationIntegrationTests
              IntegrationTestingTests/MultiModelGuidedGenerationTests
              IntegrationTestingTests/HardReserveStressTests
              IntegrationTestingTests/GuidedGenerationBenchmarkTests
              IntegrationTestingTests/GuidedGenerationUsageTests
              IntegrationTestingTests/MaxTokenTruncationTests
              IntegrationTestingTests/PrewarmGrammarTests
              IntegrationTestingTests/RequiredPropertyStressTests
              IntegrationTestingTests/StopTokenRegressionIntegrationTests
              IntegrationTestingTests/TokenizerVocabExtractorTests
              IntegrationTestingTests/XGrammarBridgeTests
              IntegrationTestingTests/EmitStopSignalTests
              IntegrationTestingTests/FastForwardTokenizationDisagreementTests
              IntegrationTestingTests/ForkIndependenceTests
              IntegrationTestingTests/LoopInvariantsOnXGrammarTests
              IntegrationTestingTests/RollbackDeterminismTests
          # MLXFoundationModelsIntegration/ToolCalling. Qwen3-1.7B and
          # R1-Distill-1.5B, plus Qwen2.5-3B as the default model.
          - name: toolcalling
            needs_gb: 12
            only: >-
              IntegrationTestingTests/FoundationModelsToolCallingTests
              IntegrationTestingTests/ToolCallingReasoningTests
              IntegrationTestingTests/MultiTurnToolCallingTests
              IntegrationTestingTests/ToolCallingReasoningCharacterizationTests
              IntegrationTestingTests/StructuredToolOutputSessionTests
              IntegrationTestingTests/ToolCallGrammarCharacterizationTests
              IntegrationTestingTests/ToolCallRoundTripTests
          # MLXFoundationModelsIntegration TextGeneration, Reasoning,
          # PlatformAvailability and GoldenReplay.
          - name: fm-sessions
            needs_gb: 14
            only: >-
              IntegrationTestingTests/IntegrationTests
              IntegrationTestingTests/SessionUsageAccountingTests
              IntegrationTestingTests/UpdateUsageEmissionTests
              IntegrationTestingTests/ApplyChatTemplateProbeTests
              IntegrationTestingTests/StreamingDeltaTests
              IntegrationTestingTests/PlainChatGenerationTests
              IntegrationTestingTests/SamplingModeBehaviorTests
              IntegrationTestingTests/ReasoningIntegrationTests
              IntegrationTestingTests/ReasoningCapabilityGateTests
              IntegrationTestingTests/ReasoningFamilyVerificationTests
              IntegrationTestingTests/ConfigurationResolverRoutingTests
              IntegrationTestingTests/PlatformCompatibilityProbes
              IntegrationTestingTests/HuggingFaceLanguageModelMacroSmoke
              IntegrationTestingTests/ColdHubClientFetchTests
              IntegrationTestingTests/GoldenReplayTests
              IntegrationTestingTests/GoldenFixtureManifestTests
              IntegrationTestingTests/MalformedSchemaErrorParityTests
          # ToolCallIntegrationTests is one suite spanning six models declared in
          # Libraries/IntegrationTestHelpers, so it splits by test rather than by
          # suite. Nemotron-3-Nano-30B-A3B alone is 17.8 GB and is what pushed
          # the old core shard to a 23G cache and ENOSPC in run 35300813508.
          - name: toolcall-nemotron
            needs_gb: 26
            only: >-
              IntegrationTestingTests/ToolCallIntegrationTests/nemotronFormatAutoDetection()
              IntegrationTestingTests/ToolCallIntegrationTests/nemotronEndToEnd()
              IntegrationTestingTests/ToolCallIntegrationTests/nemotronMultiTool()
          # GLM-4-9B 5.3G, Ministral-3-3B 2.8G, Qwen3.5-2B 1.7G, LFM2-2.6B 1.5G.
          - name: toolcall-dialects
            needs_gb: 20
            only: >-
              IntegrationTestingTests/ToolCallIntegrationTests/glm4FormatAutoDetection()
              IntegrationTestingTests/ToolCallIntegrationTests/glm4EndToEnd()
              IntegrationTestingTests/ToolCallIntegrationTests/lfm2FormatAutoDetection()
              IntegrationTestingTests/ToolCallIntegrationTests/lfm2EndToEnd()
              IntegrationTestingTests/ToolCallIntegrationTests/mistral3FormatAutoDetection()
              IntegrationTestingTests/ToolCallIntegrationTests/mistral3EndToEnd()
              IntegrationTestingTests/ToolCallIntegrationTests/mistral3MultiTool()
              IntegrationTestingTests/ToolCallIntegrationTests/qwen35FormatAutoDetection()
              IntegrationTestingTests/ToolCallIntegrationTests/qwen35EndToEnd()
              IntegrationTestingTests/ToolCallIntegrationTests/qwen35MultiTool()
              IntegrationTestingTests/ToolCallIntegrationTests/qwen35StructuredToolContinuation()
          # Tokenizer-only: these pull tokenizer and config files, ~27M, NOT the
          # 19.4G and 12.1G weight sets their repo sizes suggest.
          - name: tokenizers
            needs_gb: 8
            only: >-
              IntegrationTestingTests/MuseGlimmerTokenizerIntegrationTests
              IntegrationTestingTests/HarmonyTokenizerIntegrationTests
          # Qwen3-VL-4B-Instruct-4bit, 2.9G measured.
          - name: vision
            needs_gb: 9
            only: >-
              IntegrationTestingTests/VisionIntegrationTests
              IntegrationTestingTests/StaleWeightIndexIntegrationTests
          # Cache-gated by design: `.enabled(if: hfSnapshotDir(...) != nil)`, so
          # both tests are DISABLED on a fresh VM and this shard is a no-op here.
          # Kept so the identifiers stay covered if that gate ever changes.
          - name: gemma4-eseries
            needs_gb: 8
            only: IntegrationTestingTests/Gemma4EseriesLoadIntegrationTests
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # Recorded before anything else so a failure further down can be read
      # against the toolchain and the free space the run actually started with.
      - name: Report toolchain and host
        shell: bash
        run: |
          xcodebuild -version
          swift --version
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-version)"
          sw_vers
          df -h /
          # Mirrors DeviceTier.current, which classifies on the *runtime* OS
          # version rather than #available. Printing the expectation here makes
          # a surprising skip/failure downstream self-explanatory.
          case "$(sw_vers -productVersion)" in
            27.*|2[89].*|3*) echo "Expected DeviceTier: full (OS >= 27)" ;;
            26.*)             echo "Expected DeviceTier: partial (OS 26): FM surface is @available(macOS 27, *)" ;;
            *)                echo "Expected DeviceTier: absent (OS < 26)" ;;
          esac

      - name: Assert Xcode 27 is the selected toolchain
        shell: bash
        run: |
          # The `xcode-27` label is a preview image and its default Xcode has
          # moved before (see the runner-images announcement about macOS 26
          # defaulting to Xcode 26.6). Fail loudly here rather than silently
          # compiling against a 26 SDK and reporting a green run that proves
          # nothing about Xcode 27, which is the entire point of this workflow.
          case "$(xcodebuild -version | head -1)" in
            "Xcode 27"*) ;;
            *)
              echo "::error::Expected Xcode 27, got '$(xcodebuild -version | head -1)' (DEVELOPER_DIR=${DEVELOPER_DIR:-default})."
              exit 1
              ;;
          esac
          case "$(xcrun --sdk macosx --show-sdk-version)" in
            27.*) ;;
            *)
              echo "::error::Expected the macOS 27 SDK, got $(xcrun --sdk macosx --show-sdk-version). The FoundationModels suites are gated on canImport(FoundationModels, _version: 2) and would compile out."
              exit 1
              ;;
          esac

      - name: Report free space
        shell: bash
        run: |
          # Read-only on purpose. An earlier revision of this step tried to
          # reclaim space and did real damage: on this image
          # /Applications/Xcode.app, Xcode_27.0.app and Xcode_27.0.0.app are all
          # 0-byte SYMLINKS to the one real 3.3G Xcode_27_beta_6.app, and
          # /Library/Developer/CoreSimulator/Profiles/Runtimes does not exist at
          # all. So `rm -rf` on the non-selected Xcodes freed 0 bytes and deleted
          # the canonical /Applications/Xcode.app symlink that other tooling
          # resolves through. Run 35250965894 then died 69 minutes in with "The
          # hosted runner lost communication with the server".
          #
          # There is nothing meaningful to reclaim here: ~37Gi free, one 3.3G
          # Xcode, no simulator runtimes. Report and move on.
          df -h /
          du -sh /Applications/Xcode*.app 2>/dev/null || true

          # Each shard has its own fresh VM and its own empty Hugging Face cache,
          # so it only downloads the models its own suites touch. needs_gb is
          # that shard's measured download plus room for the build. Fail here
          # rather than an hour into an ENOSPC.
          available_gb="$(df -g / | awk 'NR==2 { print $4 }')"
          echo "Available: ${available_gb}Gi, shard needs ${NEEDS_GB}Gi"
          if [ -z "$ONLY_TESTING" ] && [ "$available_gb" -lt "$NEEDS_GB" ]; then
            echo "::error::Shard needs ${NEEDS_GB}Gi but only ${available_gb}Gi is available."
            exit 1
          fi
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
          NEEDS_GB: ${{ matrix.shard.needs_gb }}

      - name: Verify MetalToolchain installed
        # A dispatch that sets only_testing runs that selection once, in `core`,
        # rather than repeating it in all five shards. `matrix` is not available
        # in a job-level `if:`, only at step level, so the guard lives here. The
        # other shards still boot and report their toolchain, which costs seconds.
        if: inputs.only_testing == '' || matrix.shard.name == 'core'
        shell: bash
        run: |
          # The self-hosted mac is provisioned with this already, so
          # integration_tests.yml only has to assert it. The hosted image ships
          # WITHOUT it, and mlx-swift compiles .metal sources during the build
          # (mlx-swift_Cmlx), so install it on demand instead of failing.
          #
          # Parse `Status:` rather than trusting the exit code: -showComponent
          # exits 0 and prints "Status: uninstalled" when the component is
          # absent, so an `if xcodebuild -showComponent ...` guard silently
          # succeeds and the build then dies much later on the first
          # CompileMetalFile with "cannot execute tool 'metal'".
          component_status() {
            xcodebuild -showComponent MetalToolchain 2>&1 \
              | awk -F': *' '/^Status:/ { print tolower($2); exit }'
          }
          if [ "$(component_status)" = "installed" ]; then
            echo "MetalToolchain already installed."
          else
            echo "MetalToolchain reports '$(component_status)'; downloading."
            xcodebuild -downloadComponent MetalToolchain
            if [ "$(component_status)" != "installed" ]; then
              echo "::error::MetalToolchain still reports '$(component_status)' after -downloadComponent."
              exit 1
            fi
            echo "MetalToolchain installed."
          fi

      - name: Start resource sampler
        if: inputs.only_testing == '' || matrix.shard.name == 'core'
        shell: bash
        run: |
          # Two runs have died with "The hosted runner lost communication with
          # the server", and the log GitHub returns is truncated to whatever was
          # flushed before the agent went away, so it holds no evidence. Sample
          # to a file and upload it even on failure. Memory is the first
          # suspicion: these tests load real models, and the suite already ships
          # releaseAllGPUMemory() helpers for cross-suite pressure.
          cat > /tmp/sampler.sh <<'SAMPLER'
          while :; do
            printf '%s ' "$(date -u +%H:%M:%S)"
            df -g / | awk 'NR==2 { printf "disk_avail_gb=%s ", $4 }'
            top -l1 -n0 2>/dev/null | awk '/PhysMem/ { printf "%s ", $0 }'
            sysctl -n vm.swapusage 2>/dev/null | tr -d '\n'
            printf '\n'
            sleep 20
          done
          SAMPLER
          chmod +x /tmp/sampler.sh
          nohup /tmp/sampler.sh > resource-samples.txt 2>&1 &
          echo "sampler started, pid $!"

      - name: Run IntegrationTesting tests (Xcode, macOS)
        # A dispatch that sets only_testing runs that selection once, in `core`,
        # rather than repeating it in all five shards. `matrix` is not available
        # in a job-level `if:`, only at step level, so the guard lives here. The
        # other shards still boot and report their toolchain, which costs seconds.
        if: inputs.only_testing == '' || matrix.shard.name == 'core'
        shell: bash
        env:
          # Read through the environment rather than interpolating ${{ }} into
          # the script body, so a dispatch input cannot inject shell.
          ONLY_TESTING: ${{ inputs.only_testing }}
          SHARD_ONLY: ${{ matrix.shard.only }}
          SHARD_SKIP: ${{ matrix.shard.skip }}
        run: |
          # Single worker *within* a shard: the model-dependent suites are
          # `@Suite(.serialized)` and share this job's on-disk Hugging Face cache,
          # so concurrent xctest workers race it (see
          # IntegrationTestingTests/MLXFoundationModelsIntegration/Support/FMTestHelpers.swift).
          # Parallelism comes from the matrix instead, where each shard is a
          # separate VM with a separate cache.
          set -- xcodebuild test \
            -project IntegrationTesting/IntegrationTesting.xcodeproj \
            -scheme IntegrationTesting \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -skipPackagePluginValidation \
            -resultBundlePath IntegrationTesting.xcresult
          # Expand each identifier into its own flag rather than passing a string
          # through as raw argv, so these stay test identifiers and cannot become
          # arbitrary xcodebuild options. A dispatch's only_testing replaces the
          # shard's own selection; the job guard keeps that to the core shard.
          if [ -n "$ONLY_TESTING" ]; then
            for identifier in $ONLY_TESTING; do
              set -- "$@" "-only-testing:$identifier"
            done
          else
            for identifier in $SHARD_ONLY; do
              set -- "$@" "-only-testing:$identifier"
            done
            for identifier in $SHARD_SKIP; do
              set -- "$@" "-skip-testing:$identifier"
            done
          fi
          echo "+ $*"
          "$@"

      # Runs on success too: on a cold VM the interesting question is often "did
      # it come close to filling the disk", which a green run hides.
      - name: Report disk usage after testing
        if: always()
        shell: bash
        run: |
          df -h /
          du -sh ~/.cache/huggingface 2>/dev/null || echo "no Hugging Face cache"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Per shard: upload-artifact@v4 rejects a duplicate name, so five
          # shards uploading one name would collide.
          name: integration-test-results-xcode27-${{ matrix.shard.name }}
          path: |
            IntegrationTesting.xcresult
            ~/Library/Logs/DiagnosticReports/*
          retention-days: 7

      - name: Upload resource samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-samples-${{ matrix.shard.name }}
          path: resource-samples.txt
          retention-days: 7
          if-no-files-found: ignore
